<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemmicorns - Chasing Rainbows</title>
    <link rel="preload" href="assets/sprites.png" as="image">
    <script src="main.js" type="module"></script>
    <style>
        canvas {
            image-rendering: pixelated;
        }

        body {
            margin: 0;
            background-color: rgb(30, 121, 167);
        }

        .full {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            
            --display: flex;
            --justify-content: center;
            --align-items: center;
        }

        .full canvas {
            position: absolute;
            object-fit: contain;
            height: 100%;
            width: 100%;
            cursor: none;
        }
    </style>
</head>
<body>
    <div class="full">
        <canvas id="level" width="800" height="460"></canvas>
    </div>
    <div class="full">
        <canvas id="game" width="800" height="460"></canvas>
    </div>
    
    
</body>
</html>
